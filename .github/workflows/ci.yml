# Project policy: do not create or commit package-lock.json.
name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag format
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import sys
          tag = sys.argv[1]
          parts = tag[1:].split(".") if tag.startswith("v") else []
          valid = (
              len(parts) == 3
              and all(part.isascii() and part.isdecimal() for part in parts)
              and all(part == "0" or not part.startswith("0") for part in parts)
          )
          if not valid:
              raise SystemExit("Release tags must use vX.Y.Z (for example v1.2.3).")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enforce no package lock
        run: test ! -e frontend/package-lock.json

      - name: Install frontend dependencies (no lockfile)
        working-directory: frontend
        run: npm install --no-package-lock

      - name: Verify no generated lockfile
        run: test ! -e frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: >-
          python -m py_compile app.py config.py nachtlauf.py quellen.py sonarr.py
          speicher.py test_tba.py ticket.py tvdb.py ui.py vorschlaege.py web.py
          core/migrations.py core/audit.py net/http_client.py net/redaction.py net/secrets.py
          plugins/registry.py api/router.py tests/test_phase1.py
          scripts/db_inspect.py scripts/sonarr_probe.py

      - name: Run Phase 1 backend tests
        run: python -m unittest discover -s tests -v

      - name: Run legacy regression suite
        run: python test_tba.py

      - name: Build Docker image (no push)
        run: docker build --tag metadatarr:ci .

  publish:
    name: Publish Docker image to GHCR
    needs: validate
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/phil-bot/metadatarr
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
